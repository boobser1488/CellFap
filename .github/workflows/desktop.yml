name: Desktop packages
on:
  push:
    branches: [fork-import, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libglfw3-dev ninja-build mesa-vulkan-drivers xvfb patchelf
          # Jammy has Vulkan headers but no glslc package. Only compile SPIR-V in Noble.
          docker run -d --name shader-tools -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ubuntu:24.04 sleep infinity
          docker exec shader-tools sh -c 'apt-get update && apt-get install -y glslc'
          printf '%s\n' '#!/bin/sh' 'exec docker exec -u "$(id -u):$(id -g)" shader-tools glslc "$@"' | sudo tee /usr/local/bin/glslc >/dev/null
          sudo chmod +x /usr/local/bin/glslc
      - if: runner.os == 'macOS'
        run: brew install glfw shaderc vulkan-headers vulkan-loader molten-vk
      - name: Build
        run: |
          cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out --target CellFap modpack native_example shader_example --parallel 3
      - uses: actions/checkout@v5
        with:
          repository: boobser1488/dypt
          ref: bfbd8ea073a45185ce62048ca67af080d68ad423
          path: dypt
      - name: Build scripting runtime
        run: cargo build --release --manifest-path dypt/embed/Cargo.toml
      - name: Package
        run: |
          set -eu
          dir=CellFap-${{ matrix.platform }}
          mkdir -p "$dir/mods"
          cp out/CellFap out/modpack README.md "$dir/"
          cp dypt/embed/target/release/libdypt_embed.* "$dir/"
          rm -f "$dir/libdypt_embed.d"
          cp -R mods/example out/mods/native_example out/mods/shader_tint "$dir/mods/"
          if [[ "$RUNNER_OS" == macOS ]]; then
            mkdir -p "$dir/lib"
            for lib in "$(brew --prefix glfw)/lib/libglfw.3.dylib" "$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"; do
              cp -L "$lib" "$dir/lib/"
            done
            for bin in "$dir/CellFap" "$dir/lib/"*.dylib; do
              chmod u+w "$bin"
              for dep in $(otool -L "$bin" | awk 'NR>1 {print $1}'); do
                case "$dep" in
                  */libglfw.3.dylib|*/libvulkan.1.dylib) install_name_tool -change "$dep" "@executable_path/lib/${dep##*/}" "$bin";;
                esac
              done
              codesign --force --sign - "$bin"
            done
            echo '{"file_format_version":"1.0.0","ICD":{"library_path":"./libMoltenVK.dylib","api_version":"1.2.0","is_portability_driver":true}}' > "$dir/lib/MoltenVK.json"
            printf '%s\n' '#!/bin/bash' 'cd "$(dirname "$0")"' 'export VK_DRIVER_FILES="$PWD/lib/MoltenVK.json"' 'export DYLD_LIBRARY_PATH="$PWD/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"' 'exec ./CellFap "$@"' > "$dir/Start.command"
            chmod +x "$dir/Start.command"
            (cd "$dir" && ./Start.command --exit-after 2 --screenshot "$RUNNER_TEMP/smoke.png" --screenshot-after 0.5)
          else
            mkdir -p "$dir/lib"
            for lib in libglfw.so.3 libvulkan.so.1; do
              cp -L "/usr/lib/x86_64-linux-gnu/$lib" "$dir/lib/"
            done
            patchelf --set-rpath '$ORIGIN/lib' "$dir/CellFap"
            printf '%s\n' '#!/bin/sh' 'cd "$(dirname "$0")" || exit 1' 'exec ./CellFap "$@"' > "$dir/start.sh"
            chmod +x "$dir/start.sh"
            echo 'Linux x86-64, Ubuntu 22.04 or compatible. Extract, then run ./start.sh. Requires a graphical session (X11 or XWayland) and a Vulkan driver.' > "$dir/RUN.txt"
          fi
          tar -czf "$dir.tar.gz" "$dir"
          if [[ "$RUNNER_OS" == Linux ]]; then
            tar -xzf "$dir.tar.gz" -C "$RUNNER_TEMP"
            ldd "$RUNNER_TEMP/$dir/CellFap" | grep -F "$RUNNER_TEMP/$dir/lib/libglfw.so.3"
            xvfb-run -a "$RUNNER_TEMP/$dir/start.sh" --exit-after 4 --screenshot "$RUNNER_TEMP/smoke.png" --screenshot-after 0.5
          fi
          test -s "$RUNNER_TEMP/smoke.png"
      - uses: actions/upload-artifact@v6
        with:
          name: CellFap-${{ matrix.platform }}
          path: CellFap-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
